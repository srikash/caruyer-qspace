[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qspace"
version = "0.1.dev0"
description = "Tools for sampling and reconstruction in continuous q-space diffusion MRI."
readme = "README"
authors = [{ name = "Emmanuel Caruyer", email = "Emmanuel.Caruyer@irisa.fr" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Needed only by the mspf_fit command, which reads and writes NIfTI images.
nifti = ["nibabel>=5.0"]
test = ["pytest>=7"]

[project.scripts]
create_dvs = "qspace.cli.create_dvs:main"
mspf_fit = "qspace.cli.mspf_fit:main"
multishell = "qspace.cli.multishell:main"
visu_btable = "qspace.cli.visu_btable:main"

[tool.setuptools.packages.find]
include = ["qspace*"]

[tool.setuptools.package-data]
"qspace.sampling" = ["data/*.txt"]
"qspace.sampling.waveforms" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:qspace.*"]
